# Strategy details config file for BF trader  #
#Filtering settings
EVENTS:
  - Soccer
COMPETITIONS:
  - English Premier League
  - UEFA Champions League
# SP-400: capture Over/Under total-goals markets alongside MATCH_ODDS. Codes
# VALIDATED against live Betfair listMarketTypes for Soccer + EPL/UCL
# (scripts/validate_market_types.py, 2026-10-27):
#   OVER_UNDER_25  present on 39 markets  (runners: Under/Over 2.5 Goals) -- primary target
#   OVER_UNDER_15  present on  5 markets  (thinner coverage; the ticket's "consider 1.5")
# NOTE: there is NO standalone OVER_UNDER_35 market type for these competitions -- the
# 3.5 line only appears inside the aggregate ALT_TOTAL_GOALS ("Goal Lines") market and as
# FIRST_HALF_GOALS_35, so it is deliberately NOT listed here. (OVER_UNDER_05 also exists,
# full coverage, but is outside this ticket's scope.)
MARKET_TYPEs:
  - MATCH_ODDS
  - OVER_UNDER_25
  - OVER_UNDER_15
MAX_EVENTS: 5
MIN_DAYS_TILL_START: 1
MAX_DAYS_TILL_START: 5
NEWEST_FIRST: True

# Monitor timing configuration
UPDATE_FREQUENCY_TIERS:
  IN_PLAY: 5
  LESS_THAN_3H: 300
  LESS_THAN_6H: 900
  LESS_THAN_12H: 3600
  MORE_THAN_12H: 14400

INITIAL_UPDATE_FREQUENCY: 14400
STALE_TARGET_HOURS: 24
MONITOR_MAX_WAIT_SECONDS: 900
# 6-hour (21600s) wall-clock safety backstop for a single in-play run (SP-343).
MONITOR_HARD_CAP_SECONDS: 21600
# Pre-kickoff lead window (1200s = 20 min): an OPEN target within this many
# seconds of kickoff is polled at the 5s IN_PLAY cadence. MUST exceed the
# ~15-min Rundeck re-trigger interval plus margin so a run is always alive at 5s
# before any kickoff (SP-343).
MONITOR_LEAD_WINDOW_SECONDS: 1200
